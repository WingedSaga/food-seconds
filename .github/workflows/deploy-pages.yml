name: Deploy Food Seconds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: food-seconds-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_BASE: /food-seconds/
          # The public gateway now forwards this path to Food Seconds on the
          # HomeLab.  A repository variable can still replace it later when
          # the final dedicated domain is ready.
          VITE_API_URL: ${{ vars.FOOD_API_URL || 'https://wingedsaga.tail7db1c9.ts.net/food/api' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
